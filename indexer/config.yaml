# Envio HyperIndex V3 — Monad testnet
# Development plan cannot set ENVIO_API_TOKEN (env vars = Production feature),
# so we use public/HyperRPC endpoints for sync instead of hosted HyperSync auth.
name: pocket-settlement
description: Indexes Agora Instant Settlement Swap events on Monad testnet for POCKET receipts
chains:
  - id: 10143
    # Near-head start keeps Development RPC sync feasible (no HyperSync token).
    start_block: 70800000
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: sync
      - url: https://monad-testnet.rpc.hypersync.xyz
        for: fallback
    contracts:
      - name: AgoraPair
        address:
          - "0x1Aa8958Aa34cEC8096EF4381cb335effe977b0ae"
        handler: src/EventHandlers.ts
        events:
          - event: Swap(address indexed sender, uint256 amount0In, uint256 amount1In, uint256 amount0Out, uint256 amount1Out, address indexed to)
            field_selection:
              transaction_fields:
                - hash
