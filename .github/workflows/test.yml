name: test
on:
  push: { branches: [near-hackathon, main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Testnet keys are optional repo secrets. Without them the testnet and browser money steps are skipped, not failed.
      - name: Write .env.local from secrets
        env:
          NEXT_PUBLIC_POCKET_ROOT: ${{ secrets.NEXT_PUBLIC_POCKET_ROOT }}
          SPONSOR_PRIVATE_KEY: ${{ secrets.SPONSOR_PRIVATE_KEY }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          MAKER_PRIVATE_KEY: ${{ secrets.MAKER_PRIVATE_KEY }}
          FAUCET_PRIVATE_KEY: ${{ secrets.FAUCET_PRIVATE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          : > .env.local
          for n in NEXT_PUBLIC_POCKET_ROOT SPONSOR_PRIVATE_KEY RELAYER_PRIVATE_KEY MAKER_PRIVATE_KEY FAUCET_PRIVATE_KEY GROQ_API_KEY; do
            v="${!n}"; [ -n "$v" ] && echo "$n=$v" >> .env.local || true
          done
      - run: npm run test:all
        env: { SMOKE_URL: "${{ vars.SMOKE_URL }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: test-results, retention-days: 14 }
