<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pUSD, Pocket test dollar">
  <title>pUSD</title>
  <defs>
    <linearGradient id="pusd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D5A49"/>
      <stop offset="1" stop-color="#0F3329"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#pusd-bg)"/>
  <!-- the Pocket silhouette: a round top over a soft flat base -->
  <path d="M23 47h18a9 9 0 0 0 9-9v-2.5a18 18 0 0 0-36 0V38a9 9 0 0 0 9 9z" fill="none" stroke="#F4F8F6" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- a geometric S made of two half circles -->
  <path d="M37 29.6a5 5 0 1 0-5 5a5 5 0 1 1-5 5" fill="none" stroke="#F4F8F6" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the dollar stroke rises out of the pocket -->
  <path d="M32 12v8.6M32 44.6V52" stroke="#5FD3A5" stroke-width="3.4" stroke-linecap="round"/>
</svg>
