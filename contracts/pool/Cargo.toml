[package]
name = "pocket_pool"
version = "0.1.0"
edition = "2021"
description = "Pocket private pool: fixed size NEAR notes, Groth16 proofs checked with NEAR's alt_bn128 host functions (testnet)."
license = "MIT"
repository = "https://github.com/henrysammarfo/pocket"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.15"
uint = { version = "0.9.5", default-features = false }
# Vendored unchanged from hideyour-cash/hideyour-cash at 6f27e38 (MIT/Apache-2.0), see vendor/README.md
ff_wasm_unknown_unknown = { path = "vendor/ff_wasm_unknown_unknown", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
near-sdk = { version = "5.15", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
