[package]
name = "pocket_token"
version = "0.1.0"
edition = "2021"
description = "Fixed supply NEP-141 token for Pocket on NEAR testnet (pUSD and paper stock tokens). No mint function."
license = "MIT"
repository = "https://github.com/henrysammarfo/pocket"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.15"
near-contract-standards = "5.15"

[dev-dependencies]
near-sdk = { version = "5.15", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
