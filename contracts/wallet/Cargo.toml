[package]
name = "pocket_wallet"
version = "0.1.0"
edition = "2021"
description = "Pocket wallet: spending limits enforced by the account's own contract on NEAR testnet."
license = "MIT"
repository = "https://github.com/henrysammarfo/pocket"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.15"

[dev-dependencies]
near-sdk = { version = "5.15", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
