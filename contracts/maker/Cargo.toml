[package]
name = "pocket_maker"
version = "0.1.0"
edition = "2021"
description = "Pocket maker: settles paper trades atomically inside the NEAR Intents verifier against quotes Pocket signed."
license = "MIT"
repository = "https://github.com/henrysammarfo/pocket"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.15"

[dev-dependencies]
near-sdk = { version = "5.15", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
